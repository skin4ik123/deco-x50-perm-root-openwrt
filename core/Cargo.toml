[package]
name = "deco-core"
version = "1.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
[lib]
name = "deco_core"
crate-type = ["cdylib", "rlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha1 = "0.11"
base64 = "0.23"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
jni = "=0.21.1"
libc = "0.2"
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 2
strip = "debuginfo"
panic = "unwind"
